name: Release

on:
  push:
    tags: [ '*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
          Expand-Archive -Force latest.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"

      - name: Build
        run: dotnet build Play4ME/Play4ME.csproj -c Release

      - name: Test
        run: dotnet test Play4ME.Tests/Play4ME.Tests.csproj -c Release

      - name: Find plugin zip
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path Play4ME/bin -Recurse -Filter latest.zip | Select-Object -First 1
          if (-not $zip) { Get-ChildItem -Path Play4ME/bin -Recurse | Select-Object FullName; throw "latest.zip not found" }
          Copy-Item $zip.FullName Play4ME.zip
          Write-Host "Found $($zip.FullName)"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Play4ME
          path: Play4ME.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" Play4ME.zip --clobber
          if ($LASTEXITCODE -ne 0) {
            gh release create "${{ github.ref_name }}" Play4ME.zip --title "${{ github.ref_name }}" --notes "Play4ME ${{ github.ref_name }}"
          }
